        var audio = document.getElementById("myMusic"); 
        // var audio_file = new Audio('./bgm_Rain.ogg');
        audio.addEventListener('timeupdate', function () {
            var buffer = .8;
            if (this.currentTime > this.duration - buffer) {
                this.currentTime = 1.6;
                this.play();

        }, false);
